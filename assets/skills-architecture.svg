<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bg)" stroke="#1f2937" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="500" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f9fafb" text-anchor="middle" letter-spacing="0.5">Como Funciona o Sistema de Skills no Google Antigravity</text>
  <text x="500" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Descoberta Hierárquica, Carregamento Progressivo (On-Demand) e Execução Segura</text>

  <!-- Stage 1: Discovery & Precedence -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="280" height="350" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="280" height="40" rx="12" fill="url(#cyan-glow)"/>
    <rect y="28" width="280" height="12" fill="#131c2e"/>
    <text x="140" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1. HIERARQUIA DE DESCOBERTA</text>

    <!-- Step Items -->
    <g transform="translate(16, 55)">
      <rect width="248" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1º Prioridade Máxima</text>
      <text x="12" y="40" font-family="monospace" font-size="11" fill="#e2e8f0">.agents/skills/ (Workspace)</text>
    </g>

    <g transform="translate(16, 120)">
      <rect width="248" height="52" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="0.8"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#60a5fa">2º Configuração Local</text>
      <text x="12" y="40" font-family="monospace" font-size="11" fill="#e2e8f0">skills.json (Declaradas)</text>
    </g>

    <g transform="translate(16, 185)">
      <rect width="248" height="52" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="0.8"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#818cf8">3º Instalação Global</text>
      <text x="12" y="40" font-family="monospace" font-size="10" fill="#cbd5e1">~/.gemini/antigravity/builtin/</text>
    </g>

    <g transform="translate(16, 250)">
      <rect width="248" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8">4º Built-in do Sistema</text>
      <text x="12" y="40" font-family="monospace" font-size="11" fill="#94a3b8">Mounted by Name</text>
    </g>

    <text x="140" y="328" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Sobrescreve da base para o topo</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 330 285 L 350 285" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="350,280 360,285 350,290" fill="#38bdf8"/>

  <!-- Stage 2: Progressive Disclosure -->
  <g transform="translate(360, 110)" filter="url(#shadow)">
    <rect width="280" height="350" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="280" height="40" rx="12" fill="url(#purple-glow)"/>
    <rect y="28" width="280" height="12" fill="#131c2e"/>
    <text x="140" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2. PROGRESSIVE DISCLOSURE</text>

    <!-- Phase A -->
    <g transform="translate(16, 55)">
      <rect width="248" height="70" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc">A. Inicialização Leve (Zero Bloat)</text>
      <text x="12" y="42" font-family="sans-serif" font-size="11" fill="#e2e8f0">Injeta APENAS nome e descrição</text>
      <text x="12" y="58" font-family="monospace" font-size="10" fill="#a855f7">name: evidence-first</text>
    </g>

    <!-- Phase B -->
    <g transform="translate(16, 140)">
      <rect width="248" height="70" rx="8" fill="#1e293b" stroke="#e879f9" stroke-width="1"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#e879f9">B. Avaliação Contextual</text>
      <text x="12" y="42" font-family="sans-serif" font-size="11" fill="#e2e8f0">O agente avalia a intenção</text>
      <text x="12" y="58" font-family="sans-serif" font-size="11" fill="#f472b6">"Usuário pediu verificação?"</text>
    </g>

    <!-- Phase C -->
    <g transform="translate(16, 225)">
      <rect width="248" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#fb7185">C. Ativação On-Demand</text>
      <text x="12" y="42" font-family="sans-serif" font-size="11" fill="#e2e8f0">Lê o conteúdo integral do</text>
      <text x="12" y="58" font-family="monospace" font-size="11" fill="#fda4af">SKILL.md sob demanda!</text>
    </g>

    <text x="140" y="328" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Economia de 90%+ de contexto</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 650 285 L 670 285" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="670,280 680,285 670,290" fill="#f43f5e"/>

  <!-- Stage 3: Anatomy & Execution -->
  <g transform="translate(680, 110)" filter="url(#shadow)">
    <rect width="280" height="350" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="280" height="40" rx="12" fill="url(#amber-glow)"/>
    <rect y="28" width="280" height="12" fill="#131c2e"/>
    <text x="140" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3. ANATOMIA DE UMA SKILL</text>

    <!-- File tree -->
    <g transform="translate(16, 55)">
      <rect width="248" height="240" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="25" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">📁 skills/evidence-first/</text>
      
      <text x="24" y="55" font-family="monospace" font-size="11" fill="#fbbf24">├── 📄 SKILL.md</text>
      <text x="44" y="72" font-family="sans-serif" font-size="10" fill="#94a3b8">• YAML frontmatter + instruções</text>
      
      <text x="24" y="102" font-family="monospace" font-size="11" fill="#38bdf8">├── 📁 scripts/</text>
      <text x="44" y="119" font-family="sans-serif" font-size="10" fill="#94a3b8">• Executáveis automáticos (sh/py)</text>

      <text x="24" y="149" font-family="monospace" font-size="11" fill="#a78bfa">├── 📁 references/</text>
      <text x="44" y="166" font-family="sans-serif" font-size="10" fill="#94a3b8">• Manuais aprofundados</text>

      <text x="24" y="196" font-family="monospace" font-size="11" fill="#f472b6">└── 📁 examples/</text>
      <text x="44" y="213" font-family="sans-serif" font-size="10" fill="#94a3b8">• Exemplos de entrada e saída</text>
    </g>

    <text x="140" y="328" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Execução isolada e determinística</text>
  </g>
</svg>
