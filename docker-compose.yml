version: '3.8'

services:
  antigravity-monitor:
    build: .
    container_name: antigravity-vibe-monitor
    restart: unless-stopped
    ports:
      - "4242:4242"
    environment:
      - PORT=4242
      - NODE_ENV=production
    volumes:
      # Mount projects directory to allow the dashboard to monitor your code
      - /Users/danieljuniorbarbosadasilva/Desktop:/projects:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4242/"]
      interval: 30s
      timeout: 5s
      retries: 3
